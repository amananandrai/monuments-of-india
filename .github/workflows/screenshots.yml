# Redraws the home view of a monument when that monument's own code changes, and commits the
# picture (assets/views/<id>.png) and the state list (monuments.md).
#
# What starts it:
# - a push to main, or a pull request, that changes a monument's own file: js/monuments/<name>.js
#   or js/details/<name>.js. Only the monuments those files belong to are redrawn
#   (tools/changed-monuments.mjs maps a file to its monument);
# - js/data.js, where the list's names, places and dates live: the list is rewritten, and no
#   picture is redrawn unless a monument's file changed too.
# What does not: a shared part (js/details/realism.js, components.js and the others listed
# below), js/surface.js, js/main.js, CSS, the README, the guides, or this file. Those change many
# monuments or none. When one changes the look, run this workflow by hand ("Run workflow"): with
# the ids box empty it redraws all 101, or name the ones to redraw.
#
# The plain renderer (tools/shoot-views.mjs) is used rather than --site: a full site shot of all
# 101 models is about an hour on a CPU runner. The commit is marked [skip ci], and the paths it
# touches are not listed below, so it does not start another run.
name: Monument screenshots

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Monument ids to redraw, separated by spaces. Leave empty to redraw all.'
        required: false
        default: ''
  push:
    branches: [main]
    paths: &monument-js
      - 'js/monuments/**'
      - 'js/details/**'
      - 'js/data.js'
      # The shared parts in js/details: used by many monuments, so they belong to none.
      - '!js/details/animals.js'
      - '!js/details/colonial.js'
      - '!js/details/components.js'
      - '!js/details/doorways.js'
      - '!js/details/figures.js'
      - '!js/details/forts.js'
      - '!js/details/mughal.js'
      - '!js/details/realism.js'
      - '!js/details/sculpture.js'
      - '!js/details/temples.js'
      - '!js/details/terrain.js'
      - '!js/details/tibetan.js'
  pull_request:
    paths: *monument-js

permissions:
  contents: write

concurrency:
  group: monument-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          # The whole history, so the changed files can be read off against the commit before.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Find the monuments that changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          IDS_INPUT: ${{ inputs.ids }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=false
          ids=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Run by hand: the ids asked for (letters, digits and hyphens only), or every monument.
            ids=$(printf '%s' "$IDS_INPUT" | tr -c 'a-z0-9- ' ' ' | xargs)
            if [ -z "$ids" ]; then all=true; fi
          else
            if [ "$EVENT" = "pull_request" ]; then
              files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            else
              # A push: against the commit main stood at before it. A first push has none.
              if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then BEFORE=HEAD~1; fi
              files=$(git diff --name-only "$BEFORE" HEAD)
            fi
            ids=$(printf '%s\n' "$files" | node tools/changed-monuments.mjs)
          fi
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          if [ "$all" = true ]; then echo "Redrawing every monument."; elif [ -n "$ids" ]; then echo "Redrawing: $ids"; else echo "No monument's own file changed: no picture to redraw."; fi

      - name: Install the renderer
        if: steps.changed.outputs.all == 'true' || steps.changed.outputs.ids != ''
        working-directory: tools
        run: |
          npm ci
          # ubuntu-latest already has Chromium's shared libraries (libnss3, libgbm1,
          # and the rest). Do not pass --with-deps: that also apt-installs extra fonts
          # from security.ubuntu.com, and a DNS failure there ended the run before
          # a single picture.
          ok=0
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              ok=1
              break
            fi
            echo "Chromium download failed (attempt ${attempt} of 3). Retrying."
            sleep $((attempt * 15))
          done
          test "$ok" = 1

      - name: Redraw the changed home views
        if: steps.changed.outputs.all == 'true' || steps.changed.outputs.ids != ''
        working-directory: tools
        env:
          ALL: ${{ steps.changed.outputs.all }}
          IDS: ${{ steps.changed.outputs.ids }}
        run: |
          if [ "$ALL" = true ]; then
            node shoot-views.mjs --size 800x450 --out ../assets/views
          else
            # IDS is a list of ids, split on its spaces.
            node shoot-views.mjs --size 800x450 --out ../assets/views $IDS
          fi

      - name: Rewrite the state list
        working-directory: tools
        run: node update-gallery.mjs

      - name: Commit the pictures
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/views monuments.md
          if git diff --staged --quiet; then
            echo "Pictures and list already match the models."
            exit 0
          fi
          git commit -m "Update monument screenshots [skip ci]"
          git push origin "HEAD:${BRANCH}"
