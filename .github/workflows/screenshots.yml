# Renders a home view of every monument and commits the pictures into the README state list.
# Runs only when a monument's own JavaScript changes (js/monuments or js/details), or when
# this workflow file changes. A README edit, a test, CSS, or the page shell does not start it.
# Run it by hand with workflow_dispatch when a shared file (js/surface.js, js/main.js, and
# the like) changes the look. Re-running an older failed job uses that job's workflow file,
# which still installed extra fonts; start a new run from main instead.
# The plain renderer (tools/shoot-views.mjs) is used rather than --site: a full site shot of
# all 101 models is about an hour on a CPU runner, and this finishes in a few minutes.
# The commit is marked [skip ci]. Those paths are not listed below, so the commit does not
# start another run.
name: Monument screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &monument-js
      - 'js/monuments/**'
      - 'js/details/**'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths: *monument-js

permissions:
  contents: write

concurrency:
  group: monument-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install the renderer
        working-directory: tools
        run: |
          npm ci
          # ubuntu-latest already has Chromium's shared libraries (libnss3, libgbm1,
          # and the rest). Do not pass --with-deps: that also apt-installs extra fonts
          # from security.ubuntu.com, and a DNS failure there ended the run before
          # a single picture.
          ok=0
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              ok=1
              break
            fi
            echo "Chromium download failed (attempt ${attempt} of 3). Retrying."
            sleep $((attempt * 15))
          done
          test "$ok" = 1

      - name: Render every home view
        working-directory: tools
        run: node shoot-views.mjs --size 800x450 --out ../assets/views

      - name: Update the README list
        working-directory: tools
        run: node update-readme-gallery.mjs

      - name: Commit the pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/views README.md
          if git diff --staged --quiet; then
            echo "Screenshots already match the models."
            exit 0
          fi
          git commit -m "Update monument screenshots [skip ci]"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
