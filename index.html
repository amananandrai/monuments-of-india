<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Twenty Indian landmarks, from the Qutub Minar to the Howrah Bridge, modelled in interactive 3D.">
<title>Monuments of India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Rozha+One&display=swap">
<style>
/* Layout: a monument index rail on the left, a full-bleed 3D stage on the right with a floating plaque; on phones the rail becomes a swipeable strip under the stage. */
:root {
  --bg: #eceef3;
  --fg: #1c1f30;
  --muted: #5a5f77;
  --line: rgba(28, 31, 48, 0.12);
  --panel: rgba(248, 249, 252, 0.86);
  --active: rgba(208, 106, 18, 0.12);
  --accent: #b8590c;
  --sky-top: #86afd4;
  --sky-horizon: #ebe2d3;
  --ground: #b7a684;
  --scene-mode: day;
  --font-display: "Rozha One", "Georgia", serif;
  --font-body: "Hind", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10121d;
    --fg: #ebeaf2;
    --muted: #a0a3ba;
    --line: rgba(235, 234, 242, 0.12);
    --panel: rgba(18, 20, 33, 0.8);
    --active: rgba(242, 160, 61, 0.14);
    --accent: #f2a03d;
    --sky-top: #060a1a;
    --sky-horizon: #2c2944;
    --ground: #24242f;
    --scene-mode: night;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10121d;
  --fg: #ebeaf2;
  --muted: #a0a3ba;
  --line: rgba(235, 234, 242, 0.12);
  --panel: rgba(18, 20, 33, 0.8);
  --active: rgba(242, 160, 61, 0.14);
  --accent: #f2a03d;
  --sky-top: #060a1a;
  --sky-horizon: #2c2944;
  --ground: #24242f;
  --scene-mode: night;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
}
.app {
  height: 100%;
  display: grid;
  grid-template-columns: 300px 1fr;
}
.side {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--line);
}
.masthead {
  padding: 22px 20px 14px;
  border-bottom: 1px solid var(--line);
}
.masthead h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 28px;
  line-height: 1.1;
  text-wrap: balance;
}
.masthead .hi {
  margin: 4px 0 0;
  color: var(--accent);
  font-size: 15px;
}
.masthead p.sub {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
}
.list {
  list-style: none;
  margin: 0;
  padding: 8px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.item {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: baseline;
  gap: 2px 10px;
  padding: 9px 12px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.item:hover { background: var(--line); }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.item[aria-current="true"] { background: var(--active); }
.item[aria-current="true"] .name { color: var(--accent); }
.item .name { font-weight: 600; font-size: 15px; }
.item .h {
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.item .place { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }

.stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
#scene { display: block; width: 100%; height: 100%; touch-action: none; }
.status {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 14px;
  pointer-events: none;
}
.toolbar {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  gap: 6px;
}
.btn {
  height: 36px;
  min-width: 36px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--panel);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--fg);
  font: 500 13px/1 var(--font-body);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[aria-pressed="true"] { color: var(--accent); }
.btn svg { width: 16px; height: 16px; }

.plaque {
  position: absolute;
  left: 16px;
  bottom: 16px;
  width: min(380px, calc(100% - 32px));
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.plaque .eyebrow {
  margin: 0;
  color: var(--muted);
  font-size: 11.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.plaque h2 {
  margin: 2px 0 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 30px;
  line-height: 1.1;
  text-wrap: balance;
}
.plaque .local { margin: 2px 0 0; color: var(--accent); font-size: 15px; }
.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 12px 0 0;
  padding: 10px 0 0;
  border-top: 1px solid var(--line);
}
.stats div { min-width: 0; }
.stats dt {
  color: var(--muted);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.stats dd {
  margin: 0;
  font-weight: 600;
  font-size: 14px;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;
}
details.facts { margin-top: 10px; }
details.facts summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 500;
}
details.facts ul {
  margin: 6px 0 0;
  padding-left: 18px;
  font-size: 13.5px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hint {
  position: absolute;
  right: 16px;
  bottom: 16px;
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  pointer-events: none;
}

@media (max-width: 760px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }
  .side { display: contents; }
  .masthead {
    grid-row: 1;
    padding: 12px 16px 10px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .masthead h1 { font-size: 22px; }
  .masthead .hi { margin: 0; font-size: 13px; }
  .masthead p.sub { display: none; }
  .stage { grid-row: 2; }
  .list {
    grid-row: 3;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 8px 16px;
    border-top: 1px solid var(--line);
    scroll-snap-type: x proximity;
  }
  .list li { flex: 0 0 auto; scroll-snap-align: start; }
  .item { width: 160px; padding: 7px 10px; }
  .plaque { padding: 12px 14px; }
  .plaque h2 { font-size: 24px; }
  .hint { display: none; }
  .toolbar { top: 12px; right: 12px; }
  .btn .label { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .list { scroll-behavior: auto; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <header class="masthead">
      <h1>Monuments of India</h1>
      <p class="hi" lang="hi">भारत के स्मारक</p>
      <p class="sub">Twenty landmarks modelled in 3D at their real proportions. Pick one, then drag to walk around it.</p>
    </header>
    <ul class="list" id="list"></ul>
  </aside>

  <main class="stage" id="stage">
    <canvas id="scene" aria-label="3D model of the selected monument"></canvas>
    <div class="status" id="status">Loading the 3D engine…</div>

    <div class="toolbar">
      <button class="btn" id="prev" type="button" aria-label="Previous monument">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
      </button>
      <button class="btn" id="next" type="button" aria-label="Next monument">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg>
      </button>
      <button class="btn" id="rotate" type="button" aria-pressed="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.8-4.1"/><path d="M12 1.5v2.8H9.2"/></svg>
        <span class="label">Auto-rotate</span>
      </button>
      <button class="btn" id="reset" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg>
        <span class="label">Reset view</span>
      </button>
    </div>

    <section class="plaque" id="plaque" aria-live="polite">
      <p class="eyebrow" id="p-place"></p>
      <h2 id="p-name"></h2>
      <p class="local" id="p-local"></p>
      <dl class="stats">
        <div><dt id="p-stat-label">Height</dt><dd id="p-stat"></dd></div>
        <div><dt>Built</dt><dd id="p-built"></dd></div>
        <div><dt>Style</dt><dd id="p-style"></dd></div>
      </dl>
      <details class="facts" id="p-facts-wrap" open>
        <summary id="p-material"></summary>
        <ul id="p-facts"></ul>
      </details>
    </section>
    <p class="hint">Drag to orbit · scroll or pinch to zoom · ← → to switch</p>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script>
  window.addEventListener('error', function () {
    var s = document.getElementById('status');
    if (s && !s.hidden) s.textContent = 'The 3D engine could not load. Check your connection and reload the page.';
  });
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- materials ---------- */
const mat = (color, roughness = 0.85, metalness = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const M = {
  marble: mat('#f2eee6', 0.45),
  marbleShade: mat('#c9c0b0', 0.6),
  recess: mat('#4a3f38', 0.9),
  red: mat('#a4553b', 0.85),
  redLight: mat('#b86b4f', 0.85),
  buff: mat('#cfae86', 0.85),
  basalt: mat('#c4a46c', 0.85),
  plaster: mat('#ddd3bf', 0.85),
  granite: mat('#a08d70', 0.9),
  graniteDark: mat('#7d6d57', 0.9),
  pink: mat('#e3ad93', 0.8),
  pinkShade: mat('#c98f77', 0.85),
  puri: mat('#e4ddcf', 0.85),
  puriShade: mat('#b8ab95', 0.9),
  bronze: mat('#8a6644', 0.45, 0.6),
  steel: mat('#8e9ba5', 0.5, 0.55),
  gold: mat('#d6a640', 0.3, 0.85),
  concrete: mat('#aaa59b', 0.9),
  asphalt: mat('#3c3c40', 0.9),
  water: mat('#3e6f86', 0.18, 0.1),
  grass: mat('#6b8a4c', 0.95),
  path: mat('#cdbd9c', 0.95),
  bank: mat('#7d7059', 0.95),
  stoneDark: mat('#2d2a2a', 0.8),
  wood: mat('#5b4330', 0.8),
  gild: mat('#e3b54a', 0.32, 0.5),
  gildDeep: mat('#b8862a', 0.45, 0.5),
  hawa: mat('#df8f78', 0.85),
  hawaLight: mat('#eba792', 0.85),
  lime: mat('#f3ede2', 0.85),
  khond: mat('#7f705f', 0.95),
  khondDark: mat('#5f5347', 0.95),
  stucco: mat('#e9dcc0', 0.85),
  lotus: mat('#f4f3ef', 0.4, 0, { side: THREE.DoubleSide }),
  deccan: mat('#8d877c', 0.9),
  deccanLight: mat('#b3ada1', 0.85),
  mysore: mat('#bcb3a4', 0.85),
  mysoreRose: mat('#d8a29c', 0.7),
  sanchi: mat('#c8a885', 0.9),
  bodh: mat('#c3b294', 0.9),
  leaf: mat('#4e7c3b', 0.95, 0, { flatShading: true }),
  flagSaffron: mat('#ff9933', 0.7),
  flagWhite: mat('#f6f6f2', 0.7),
  flagGreen: mat('#138808', 0.7),
  navy: mat('#06038d', 0.6),
  saffron: mat('#ef7d1a', 0.7, 0, { side: THREE.DoubleSide }),
  flagRed: mat('#d23a24', 0.7, 0, { side: THREE.DoubleSide }),
};
// Objects shown only in the night scene (e.g. festival lighting); applyTheme toggles them.
const nightOnly = [];
let isNight = false;
const flatCache = new Map();
const flat = (m) => {
  if (!flatCache.has(m)) { const c = m.clone(); c.flatShading = true; flatCache.set(m, c); }
  return flatCache.get(m);
};

/* ---------- geometry helpers (y = bottom of object) ---------- */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function mesh(geo, m, x = 0, y = 0, z = 0) {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z);
  o.castShadow = true;
  o.receiveShadow = true;
  return o;
}
const box = (w, h, d, m, x = 0, y = 0, z = 0) => mesh(new THREE.BoxGeometry(w, h, d), m, x, y + h / 2, z);
const cyl = (rt, rb, h, m, x = 0, y = 0, z = 0, seg = 24) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m, x, y + h / 2, z);
const ring = (r, h, m, y = 0, seg = 40) => {
  const o = mesh(new THREE.CylinderGeometry(r, r, h, seg, 1, true), m, 0, y + h / 2, 0);
  o.material = m.side === THREE.DoubleSide ? m : doubleSided(m);
  return o;
};
const dsCache = new Map();
function doubleSided(m) {
  if (!dsCache.has(m)) { const c = m.clone(); c.side = THREE.DoubleSide; dsCache.set(m, c); }
  return dsCache.get(m);
}
const lathe = (pts, m, seg = 40) => mesh(new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg), m);
function group(...kids) { const g = new THREE.Group(); kids.forEach((k) => g.add(k)); return g; }
function at(o, x = 0, y = 0, z = 0) { o.position.set(x, y, z); return o; }
// Place an object on the face of a building whose outward normal points at `angle` (0 = +z).
function onFace(o, angle, dist, lat = 0) {
  o.position.x = Math.sin(angle) * dist + Math.cos(angle) * lat;
  o.position.z = Math.cos(angle) * dist - Math.sin(angle) * lat;
  o.rotation.y = angle;
  return o;
}
const FACES = [0, Math.PI / 2, Math.PI, -Math.PI / 2];

function strut(a, b, t, m) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(t, t, a.distanceTo(b)), m);
  o.position.copy(a).add(b).multiplyScalar(0.5);
  o.lookAt(b);
  o.castShadow = true;
  o.receiveShadow = true;
  return o;
}
function limb(a, b, r1, r2, m) {
  const o = mesh(new THREE.CylinderGeometry(r2, r1, a.distanceTo(b), 20), m);
  o.position.copy(a).add(b).multiplyScalar(0.5);
  o.quaternion.setFromUnitVectors(V(0, 1, 0), b.clone().sub(a).normalize());
  return o;
}

function archTop(p, r, s, pointed) {
  if (pointed) {
    p.bezierCurveTo(-r, s + r * 0.75, -r * 0.3, s + r * 1.1, 0, s + r * 1.4);
    p.bezierCurveTo(r * 0.3, s + r * 1.1, r, s + r * 0.75, r, s);
  } else {
    p.absarc(0, s, r, Math.PI, 0, true);
  }
}
const rise = (r, pointed) => (pointed ? r * 1.4 : r);
// A wall of w×h×d with an arch of width aw and apex height ah cut through it (front/back faces on ±z).
function archWall(w, h, d, aw, ah, pointed, m) {
  const r = aw / 2, s = ah - rise(r, pointed);
  const p = new THREE.Shape();
  p.moveTo(-w / 2, 0); p.lineTo(-r, 0); p.lineTo(-r, s);
  archTop(p, r, s, pointed);
  p.lineTo(r, 0); p.lineTo(w / 2, 0); p.lineTo(w / 2, h); p.lineTo(-w / 2, h); p.closePath();
  const geo = new THREE.ExtrudeGeometry(p, { depth: d, bevelEnabled: false, curveSegments: 18 });
  geo.translate(0, 0, -d / 2);
  return mesh(geo, m);
}
// A thin arch-shaped slab, used for niches and recessed arches on facades (faces +z).
function archPanel(aw, ah, pointed, m, depth = 0.3) {
  const r = aw / 2, s = ah - rise(r, pointed);
  const p = new THREE.Shape();
  p.moveTo(-r, 0); p.lineTo(-r, s);
  archTop(p, r, s, pointed);
  p.lineTo(r, 0); p.closePath();
  return mesh(new THREE.ExtrudeGeometry(p, { depth, bevelEnabled: false, curveSegments: 14 }), m);
}

const ONION = [[0.86, 0], [0.98, 0.18], [1.06, 0.45], [1.0, 0.75], [0.8, 1.05], [0.5, 1.32], [0.22, 1.58], [0.06, 1.78], [0, 1.85]];
function onionDome(r, m) {
  return lathe(ONION.map(([a, b]) => [a * r, b * r]), m, 48);
}
function hemi(r, m, seg = 32) {
  return mesh(new THREE.SphereGeometry(r, seg, Math.max(6, seg / 2), 0, Math.PI * 2, 0, Math.PI / 2), m);
}
function finial(h, m = M.gold) {
  const g = new THREE.Group();
  g.add(cyl(h * 0.03, h * 0.05, h * 0.75, m, 0, 0, 0, 8));
  g.add(at(mesh(new THREE.SphereGeometry(h * 0.09, 12, 8), m), 0, h * 0.32, 0));
  g.add(at(mesh(new THREE.SphereGeometry(h * 0.07, 12, 8), m), 0, h * 0.52, 0));
  g.add(cyl(0, h * 0.04, h * 0.25, m, 0, h * 0.75, 0, 8));
  return g;
}
function kalash(s, m = M.gold) {
  return lathe([[0, 0], [0.32, 0], [0.45, 0.22], [0.38, 0.42], [0.14, 0.52], [0.24, 0.6], [0.1, 0.72], [0.05, 1.0], [0, 1.12]]
    .map(([a, b]) => [a * s, b * s]), m, 24);
}
function bell(r, m) {
  return lathe([[r, 0], [r * 0.96, r * 0.28], [r * 0.72, r * 0.68], [r * 0.38, r * 0.95], [0, r * 1.05]], m, 32);
}
function chhatri(r, h, m, domeM = m) {
  const g = new THREE.Group();
  g.add(cyl(r * 1.05, r * 1.05, h * 0.06, m));
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    g.add(cyl(r * 0.07, r * 0.07, h * 0.38, m, Math.cos(a) * r * 0.82, h * 0.06, Math.sin(a) * r * 0.82, 6));
  }
  g.add(cyl(r * 1.0, r * 1.25, h * 0.07, m, 0, h * 0.44));
  g.add(at(onionDome(r * 0.95, domeM), 0, h * 0.51, 0));
  g.add(at(finial(r * 0.9), 0, h * 0.51 + r * 1.72, 0));
  return g;
}
function minaret(h, r, m, { balconies = 3, cap = 'chhatri', seg = 16, capM = m } = {}) {
  const g = new THREE.Group();
  const shaftTop = h * 0.8;
  g.add(cyl(r * 1.3, r * 1.35, h * 0.04, m, 0, 0, 0, seg));
  let y = h * 0.04, rt = r;
  const sec = (shaftTop - y) / balconies;
  for (let i = 0; i < balconies; i++) {
    const rb = r * (1 - 0.14 * i / balconies);
    rt = r * (1 - 0.14 * (i + 1) / balconies);
    g.add(cyl(rt, rb, sec, m, 0, y, 0, seg));
    y += sec;
    const bh = Math.max(0.3, r * 0.28);
    g.add(cyl(rt * 1.55, rt * 1.05, bh, m, 0, y - bh, 0, seg));
    g.add(ring(rt * 1.55, bh * 1.1, m, y, seg));
  }
  if (cap === 'chhatri') g.add(at(chhatri(rt * 1.25, h - y, m, capM), 0, y, 0));
  else {
    g.add(cyl(rt * 0.95, rt * 0.95, r * 1.2, m, 0, y, 0, seg));
    g.add(at(onionDome(rt * 1.1, capM), 0, y + r * 1.2, 0));
    g.add(at(finial(r * 1.4), 0, y + r * 1.2 + rt * 2.0, 0));
  }
  return g;
}
// Curvilinear temple tower built from stacked cross-shaped slices; prof(t) gives width at height t∈[0,1].
function shikhara(baseW, h, m, prof, n = 16) {
  const g = new THREE.Group();
  const sh = h / n;
  for (let i = 0; i < n; i++) {
    const w = baseW * prof(i / n), y = i * sh;
    g.add(box(w * 0.84, sh, w * 0.84, m, 0, y, 0));
    g.add(box(w, sh * 0.8, w * 0.6, m, 0, y, 0));
    g.add(box(w * 0.6, sh * 0.8, w, m, 0, y, 0));
  }
  const top = baseW * prof(1);
  g.add(box(top * 0.62, sh * 0.7, top * 0.62, m, 0, h, 0));
  const ar = top * 0.64, ay = h + sh * 0.7;
  const am = mesh(new THREE.SphereGeometry(ar, 28, 10), flat(m), 0, ay + ar * 0.42, 0);
  am.scale.y = 0.42;
  g.add(am);
  const ky = ay + ar * 0.84;
  g.add(at(kalash(top * 0.65), 0, ky, 0));
  g.userData.top = ky + top * 0.65 * 1.12;
  g.userData.topW = top;
  return g;
}
// Stacked horizontal slabs (pida roof) from width w0 to w1.
function pidaRoof(w0, w1, count, u, m, mRecess) {
  const g = new THREE.Group();
  let y = 0;
  for (let i = 0; i < count; i++) {
    const w = w0 + (w1 - w0) * (i / Math.max(1, count - 1));
    g.add(box(w, u, w, m, 0, y, 0));
    g.add(box(w - u * 1.6, u * 0.55, w - u * 1.6, mRecess, 0, y + u, 0));
    y += u * 1.55;
  }
  g.userData.top = y;
  return g;
}
function flag(h, m, poleM = M.wood) {
  const g = new THREE.Group();
  g.add(cyl(h * 0.012, h * 0.016, h, poleM, 0, 0, 0, 6));
  const s = new THREE.Shape();
  s.moveTo(0, h); s.lineTo(h * 0.55, h * 0.88); s.lineTo(0, h * 0.74); s.closePath();
  g.add(mesh(new THREE.ShapeGeometry(s), m));
  return g;
}

function buildQutub() {
  const g = new THREE.Group();
  g.add(box(26, 1.2, 26, M.redLight));
  const tiers = [[7.15, 5.7, 29, M.red, 0], [5.7, 4.6, 15, M.red, 1], [4.6, 3.6, 11.5, M.red, 2], [3.6, 2.95, 8, M.marble, 3], [2.95, 2.4, 8.5, M.marble, 4]];
  let y = 1.2;
  for (const [rb, rt, h, m, i] of tiers) {
    const geo = new THREE.CylinderGeometry(rt, rb, h, 144, 6);
    const pos = geo.attributes.position;
    for (let k = 0; k < pos.count; k++) {
      const x = pos.getX(k), z = pos.getZ(k);
      if (Math.hypot(x, z) < 0.01) continue;
      const a = Math.atan2(z, x);
      let f;
      if (i === 0) f = 1 + 0.07 * Math.abs(Math.cos(a * 12));           // alternating round and angular flutes
      else if (i === 1) f = 1 + 0.06 * Math.abs(Math.cos(a * 12));
      else if (i === 2) { const t = ((a / Math.PI) * 12) % 2; f = 1 + 0.08 * (1 - Math.abs((t < 0 ? t + 2 : t) - 1)); } // star flutes
      else f = 1 + 0.025 * Math.abs(Math.cos(a * 16));
      pos.setX(k, x * f); pos.setZ(k, z * f);
    }
    geo.computeVertexNormals();
    g.add(mesh(geo, m, 0, y + h / 2, 0));
    if (i < 3) for (const t of [0.28, 0.62]) g.add(cyl(rb - (rb - rt) * t + 0.35, rb - (rb - rt) * t + 0.35, 0.7, M.redLight, 0, y + h * t, 0, 48));
    if (i === 3) g.add(cyl(rt * 1.07, rb * 1.07, 1.2, M.red, 0, y + h * 0.45, 0, 48));
    y += h;
    if (i < 4) {
      g.add(cyl(rt + 1.4, rt + 0.3, 1.1, i < 3 ? M.redLight : M.marble, 0, y - 1.1, 0, 48));
      g.add(ring(rt + 1.4, 0.8, i < 3 ? M.red : M.marbleShade, y, 48));
    }
  }
  g.add(at(chhatri(2.1, 5, M.red, M.marble), 0, y, 0));
  return { group: g };
}

function nagaraProfile(t) { return 1 - 0.6 * Math.pow(t, 1.45); }
function mandap(w, h, roofCount, m, shade) {
  const g = new THREE.Group();
  g.add(box(w - 3, h, w - 3, shade));
  const n = Math.max(3, Math.round(w / 2.6));
  for (let i = 0; i <= n; i++) {
    const t = -w / 2 + 0.6 + (i / n) * (w - 1.2);
    for (const [x, z] of [[t, w / 2 - 0.6], [t, -w / 2 + 0.6], [w / 2 - 0.6, t], [-w / 2 + 0.6, t]]) g.add(cyl(0.38, 0.42, h, m, x, 0, z, 8));
  }
  g.add(box(w + 1, 1, w + 1, m, 0, h));
  const roof = pidaRoof(w * 0.92, w * 0.42, roofCount, 0.9, m, shade);
  g.add(at(roof, 0, h + 1, 0));
  const ry = h + 1 + roof.userData.top;
  g.add(at(bell(w * 0.2, m), 0, ry, 0));
  g.add(at(kalash(w * 0.12), 0, ry + w * 0.2, 0));
  return g;
}

function buildHowrah() {

  g.add(t);

function ribbed(o, n, amt) {

}

    const v = j / segV, a = (1 - v) * (1 - v), b = 2 * (1 - v) * v, c = v * v;
    const r = a * P0[0] + b * P1[0] + c * P2[0], y = a * P0[1] + b * P1[1] + c * P2[1];
    const dr = 2 * (1 - v) * (P1[0] - P0[0]) + 2 * v * (P2[0] - P1[0]);
    const dy = 2 * (1 - v) * (P1[1] - P0[1]) + 2 * v * (P2[1] - P1[1]);
    const len = Math.hypot(dr, dy) || 1, nr = dy / len, ny = -dr / len;
    const w = halfW * Math.sin(Math.PI * (0.15 + 0.85 * v));
    for (let i = 0; i <= segU; i++) {
      const u = -1 + (2 * i) / segU, off = bulge * w * (1 - u * u);
      pos.push(u * w, y + ny * off, r + nr * off);
    }
  }
  for (let j = 0; j < segV; j++) for (let i = 0; i < segU; i++) {
    const p = j * (segU + 1) + i;
    idx.push(p, p + segU + 1, p + 1, p + 1, p + segU + 1, p + segU + 2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return mesh(geo, M.lotus);
}

function instBoxes(list, m) {
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), m, list.length);
  const o = new THREE.Object3D();
  list.forEach(([x, y, z, sx, sy, sz], i) => {
    o.position.set(x, y + sy / 2, z);
    o.scale.set(sx, sy, sz);
    o.updateMatrix();
    im.setMatrixAt(i, o.matrix);
  });
  im.castShadow = true;
  im.receiveShadow = true;
  return im;
}

function buildMysorePalace() {
  const S = M.mysore, Rz = M.mysoreRose, g = new THREE.Group(), f = new THREE.Group();
  g.add(f);
  const bulbs = [];
  const line = (a, b, step = 0.9) => {
    const n = Math.max(1, Math.round(a.distanceTo(b) / step));
    for (let i = 0; i <= n; i++) bulbs.push(a.clone().lerp(b, i / n));
  };
  const rect = (x0, x1, y, z0, z1) => {
    line(V(x0, y, z0), V(x1, y, z0)); line(V(x1, y, z0), V(x1, y, z1));
    line(V(x1, y, z1), V(x0, y, z1)); line(V(x0, y, z1), V(x0, y, z0));
  };
  const verticals = (x0, x1, z0, z1, y0, y1) => { for (const x of [x0, x1]) for (const z of [z0, z1]) line(V(x, y0, z), V(x, y1, z)); };
  const arch = (aw, ah, x, y, z) => {
    const r = aw / 2, s = ah - rise(r, true), p = new THREE.Shape();
    p.moveTo(-r, 0); p.lineTo(-r, s); archTop(p, r, s, true); p.lineTo(r, 0);
    p.getSpacedPoints(Math.round(ah * 2.4)).forEach((q) => { if (q.y > 0.05) bulbs.push(V(x + q.x, y + q.y, z)); });
  };
  const dome = (cx, cy, cz, r) => {
    for (let m = 0; m < 12; m++) {
      const a = (m / 12) * Math.PI * 2;
      for (let i = 0; i < ONION.length - 1; i++) for (let t = 0; t < 1; t += 0.34) {
        const pr = ONION[i][0] + (ONION[i + 1][0] - ONION[i][0]) * t, py = ONION[i][1] + (ONION[i + 1][1] - ONION[i][1]) * t;
        bulbs.push(V(cx + Math.cos(a) * pr * r * 1.02, cy + py * r, cz + Math.sin(a) * pr * r * 1.02));
      }
    }
  };
  g.add(box(170, 0.15, 90, M.grass, 0, 0, 72), box(12, 0.2, 90, M.path, 0, 0, 72));
  const b = 1;
  f.add(box(84, b, 54, S));
  f.add(box(76, 16, 46, S, 0, b, 0), box(77, 0.8, 47, M.lime, 0, b + 16, 0));
  rect(-38.5, 38.5, b + 16.9, -23.5, 23.5);
  verticals(-38, 38, -23, 23, b, b + 16);
  for (let k = -3; k <= 3; k++) {
    if (k === 0) continue;
    f.add(onFace(at(archPanel(7, 11, true, M.recess, 0.3), 0, b + 0.5, 0), 0, 23, k * 10));
    f.add(onFace(at(archPanel(4.5, 4, true, M.recess, 0.3), 0, b + 11.5, 0), 0, 23, k * 10));
    arch(7, 11, k * 10, b + 0.5, 23.4);
    arch(4.5, 4, k * 10, b + 11.5, 23.4);
  }
  // Five-storey central tower with the gilded dome
  const tz = 18, th = 31;
  f.add(box(17, th, 16, S, 0, b, tz));
  for (let i = 0; i < 5; i++) {
    const y = b + i * 6.2, big = i === 0;
    f.add(box(17.6, 0.5, 16.6, M.lime, 0, y + 6.2 - 0.5, tz));
    for (const a of [0, Math.PI / 2, -Math.PI / 2]) {
      const o = onFace(at(archPanel(big ? 8 : 4.2, big ? 5.6 : 4.4, true, M.recess, 0.3), 0, y + 0.3, 0), a, a ? 8.5 : 8);
      o.position.z += tz;
      f.add(o);
    }
    arch(big ? 8 : 4.2, big ? 5.6 : 4.4, 0, y + 0.3, tz + 8.4);
  }
  verticals(-8.5, 8.5, tz - 8, tz + 8, b, b + th);
  rect(-8.6, 8.6, b + th, tz - 8.1, tz + 8.1);
  for (const x of [-7, 7]) for (const z of [-6.5, 6.5]) f.add(at(chhatri(1.6, 5, S, Rz), x, b + th, tz + z));
  f.add(cyl(6, 6, 2, S, 0, b + th, tz, 32), at(onionDome(6.5, M.gild), 0, b + th + 2, tz), at(finial(4), 0, b + th + 2 + 6.5 * 1.78, tz));
  dome(0, b + th + 2, tz, 6.5);
  for (const sgn of [-1, 1]) {
    const x = sgn * 34, z = 19;
    f.add(box(10, 22, 10, S, x, b, z), box(10.6, 0.5, 10.6, M.lime, x, b + 16, z));
    f.add(cyl(3.8, 3.8, 1.5, S, x, b + 22, z, 24), at(onionDome(4.2, Rz), x, b + 23.5, z), at(finial(3), x, b + 23.5 + 7.4, z));
    verticals(x - 5, x + 5, z - 5, z + 5, b, b + 22);
    rect(x - 5.1, x + 5.1, b + 22, z - 5.1, z + 5.1);
    dome(x, b + 23.5, z, 4.2);
    f.add(at(chhatri(3, 8, S, Rz), x, b + 16.8, -19));
  }
  for (const x of [-22, -12, 12, 22]) f.add(at(chhatri(2.2, 6.5, S, Rz), x, b + 16.8, 20.5));
  f.add(bulbPoints(bulbs));
  return { group: g, focus: f, view: [0.55, 0.3, 1.2] };
}

    g.add(box(8.6, 0.55, 0.6, m, 0, y));
    for (const x of [-4.4, 4.4]) {

      v.position.set(x, y + 0.27, 0);

    if (k < 2) for (const x of [-1.5, 0, 1.5]) g.add(box(0.45, 1.15, 0.45, m, x, y + 0.55));

  g.add(at(mesh(new THREE.TorusGeometry(0.7, 0.12, 6, 20), m), 0, 12.6, 0));
  for (const x of [-2.4, 2.4]) g.add(box(0.3, 1.2, 0.3, m, x, 11.95));

}

function buildRedFort() {
  const Rd = M.red, Rl = M.redLight, g = new THREE.Group(), f = new THREE.Group();

  g.add(box(300, 0.25, 12, M.grass, 0, 0, 18), box(300, 0.2, 22, M.asphalt, 0, 0, 36));
  const merlons = [];
  const wall = (x0, x1, focus) => {
    const t = focus ? f : g;
    t.add(box(x1 - x0, 18, 10, Rd, (x0 + x1) / 2, 0, 0), box(x1 - x0, 0.8, 10.4, Rl, (x0 + x1) / 2, 17.2, 0));
    for (let x = x0 + 1.3; x < x1; x += 2.6) merlons.push([x, 18, 4.6, 1.5, 1.8, 0.8]);
  };
  const bastion = (x, focus) => {
    const t = focus ? f : g;
    t.add(cyl(8, 9, 20, Rd, x, 0, 2, 24), cyl(8.4, 8.4, 0.8, Rl, x, 19.2, 2, 24), at(chhatri(4.5, 10, Rd, M.marble), x, 20, 2));
  };
  for (const s of [-1, 1]) {
    wall(s < 0 ? -60 : 16, s < 0 ? -16 : 60, true);
    wall(s < 0 ? -140 : 60, s < 0 ? -60 : 140, false);
    bastion(s * 60, true);
    bastion(s * 140, false);
  }
  g.add(instBoxes(merlons, Rd));
  // Lahori Gate: arched gatehouse between octagonal towers, a row of chhatris, and the national flag
  f.add(box(32, 23, 18, Rd, 0, 0, 2), box(32.6, 1, 18.6, Rl, 0, 23, 2));
  f.add(onFace(at(archPanel(13, 20, true, Rl, 0.4), 0, 0.5, 0), 0, 11));
  f.add(onFace(at(archPanel(9, 15, true, M.recess, 0.3), 0, 0.5, 0), 0, 11.42));
  for (const x of [-17.5, 17.5]) {
    f.add(cyl(4, 4.3, 26, Rd, x, 0, 9, 8));
    for (const y of [8, 16, 23]) f.add(cyl(4.6, 4.6, 0.5, Rl, x, y, 9, 8));
    f.add(at(chhatri(3.4, 8, Rd, M.marble), x, 26, 9));
  }
  for (let k = -3; k <= 3; k++) f.add(at(chhatri(1.25, 4.5, Rd, M.marble), k * 3.5, 24, 9.5));
  f.add(at(tricolour(14), 0, 24, -2));
  return { group: g, focus: f, view: [0.5, 0.28, 1.2] };
}

  { id: 'golden-temple', name: 'Golden Temple', local: 'ਸ੍ਰੀ ਹਰਿਮੰਦਰ ਸਾਹਿਬ', lang: 'pa', place: 'Amritsar, Punjab', built: '1581–1604', stat: ['Sanctum', '12.25 m square'], style: 'Sikh', material: 'Marble and gilded copper', build: buildGoldenTemple,
    facts: ['Founded by Guru Arjan, the fifth Sikh Guru, who installed the Adi Granth here in 1604.', 'Its upper storeys were covered in gilded copper under Maharaja Ranjit Singh in the early 19th century.', 'The shrine stands in the Amrit Sarovar pool, reached by a single causeway; its langar serves free meals to tens of thousands of people every day.'] },
  { id: 'hawa-mahal', name: 'Hawa Mahal', local: 'हवा महल', lang: 'hi', place: 'Jaipur, Rajasthan', built: '1799', stat: ['Height', '15 m'], style: 'Rajput', material: 'Red and pink sandstone', build: buildHawaMahal,
    facts: ['Built by Maharaja Sawai Pratap Singh and designed by Lal Chand Ustad.', 'Its 953 small latticed windows (jharokhas) let the women of the court watch street life unseen.', 'The five-storey façade is barely one room deep; breezes through the screens gave it the name “Palace of Winds”.'] },
  { id: 'konark-sun-temple', name: 'Konark Sun Temple', local: 'କୋଣାର୍କ ସୂର୍ଯ୍ୟ ମନ୍ଦିର', lang: 'or', place: 'Konark, Odisha', built: 'c. 1250 CE', stat: ['Height', '39 m'], style: 'Kalinga', material: 'Khondalite stone', build: buildKonark,
    facts: ['Built by King Narasimhadeva I of the Eastern Ganga dynasty as a giant stone chariot for Surya, the Sun god.', 'Its 24 carved wheels work as sundials: the shadows of the spokes tell the time of day.', 'The main tower collapsed centuries ago; what stands is its porch. A UNESCO World Heritage Site since 1984.'] },

    facts: ['Dedicated to Meenakshi, a form of Parvati, and her consort Sundareswarar, a form of Shiva.', 'Its 14 gopurams are covered in thousands of painted stucco figures of gods, animals and demons.', 'The tallest, the southern gopuram, rises about 52 m above the old city.'] },
  { id: 'lotus-temple', name: 'Lotus Temple', local: 'कमल मंदिर', lang: 'hi', place: 'Kalkaji, New Delhi', built: '1980–1986', stat: ['Height', '34 m'], style: 'Expressionist', material: 'Greek Pentelic marble on concrete', build: buildLotusTemple,
    facts: ['A Baháʼí House of Worship, open to people of every faith.', 'Its 27 free-standing marble-clad petals are arranged in clusters of three to form nine sides.', 'Designed by the Iranian-born architect Fariborz Sahba and surrounded by nine pools.'] },
  { id: 'gol-gumbaz', name: 'Gol Gumbaz', local: 'ಗೋಲ ಗುಮ್ಮಟ', lang: 'kn', place: 'Vijayapura, Karnataka', built: '1626–1656', stat: ['Height', '51 m'], style: 'Deccan (Adil Shahi)', material: 'Dark basalt with lime plaster', build: buildGolGumbaz,
    facts: ['The mausoleum of Muhammad Adil Shah of the Bijapur Sultanate.', 'Its dome, about 44 m across, is one of the largest ever built without internal supports.', 'In the whispering gallery around the inside of the dome, a faint sound echoes several times.'] },
  { id: 'mysore-palace', name: 'Mysore Palace', local: 'ಮೈಸೂರು ಅರಮನೆ', lang: 'kn', place: 'Mysuru, Karnataka', built: '1897–1912', stat: ['Height', '44 m'], style: 'Indo-Saracenic', material: 'Grey granite with pink marble domes', build: buildMysorePalace,
    facts: ['Seat of the Wadiyar dynasty; it replaced an older wooden palace that burned down in 1897.', 'Designed by the British architect Henry Irwin.', 'On festival nights, and through Dasara, it is lit with nearly 100,000 bulbs. Switch to dark mode to see them.'] },

    facts: ['Commissioned by the emperor Ashoka over relics of the Buddha.', 'Its four gateways (toranas), added in the 1st century BCE, are carved with scenes from the Buddha’s life and the Jataka tales.', 'A UNESCO World Heritage Site since 1989.'] },

    facts: ['Marks the place where Siddhartha Gautama attained enlightenment under the Bodhi tree.', 'Ashoka built the first shrine here; the present brick temple dates from the Gupta period.', 'One of the oldest brick temples still standing in India, and a UNESCO site since 2002.'] },

    facts: ['Built by Shah Jahan as the palace-fortress of his new capital, Shahjahanabad.', 'Every Independence Day the Prime Minister raises the national flag here and addresses the nation.', 'Its walls run about 2.5 km; a UNESCO World Heritage Site since 2007.'] },
];

/* ---------- scene ---------- */
const stage = document.getElementById('stage');
const canvas = document.getElementById('scene');
const statusEl = document.getElementById('status');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (e) {
  statusEl.textContent = 'Your browser could not start WebGL, which this page needs to draw the 3D models.';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 20000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.6;
controls.maxPolarAngle = Math.PI / 2 - 0.04;

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false,
  uniforms: { top: { value: new THREE.Color() }, horizon: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 horizon; varying vec3 vDir; void main(){ float t = pow(clamp(vDir.y,0.0,1.0),0.55); gl_FragColor = vec4(mix(horizon, top, t),1.0); \n#include <colorspace_fragment>\n }',
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), skyMat);
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);

const groundMat = new THREE.MeshStandardMaterial({ roughness: 1 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(1, 96), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

scene.fog = new THREE.Fog(0xffffff, 100, 1000);
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x888888, 1);
scene.add(hemiLight);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target);
const flood = new THREE.DirectionalLight(0xffb36b, 0);
scene.add(flood, flood.target);

function applyTheme() {
  const cs = getComputedStyle(document.documentElement);
  const col = (n) => new THREE.Color(cs.getPropertyValue(n).trim() || '#888');
  const night = cs.getPropertyValue('--scene-mode').trim() === 'night';
  skyMat.uniforms.top.value.copy(col('--sky-top'));
  skyMat.uniforms.horizon.value.copy(col('--sky-horizon'));
  groundMat.color.copy(col('--ground'));
  scene.fog.color.copy(col('--sky-horizon'));
  isNight = night;
  nightOnly.forEach((o) => { o.visible = night; });
  if (night) {
    hemiLight.color.set('#8796c8'); hemiLight.groundColor.set('#2a2630'); hemiLight.intensity = 0.55;
    sun.color.set('#a9b8ff'); sun.intensity = 0.7;
    flood.intensity = 1.6;
  } else {
    hemiLight.color.set('#d4e4ff'); hemiLight.groundColor.set('#b49a72'); hemiLight.intensity = 0.9;
    sun.color.set('#fff1dc'); sun.intensity = 2.8;
    flood.intensity = 0;
  }
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });

/* ---------- framing & switching ---------- */
const built = new Map();
let current = -1, home = null, tween = null;

function getBuilt(i) {
  if (!built.has(i)) {
    const r = MONUMENTS[i].build();
    r.focus = r.focus || r.group;
    scene.add(r.group);
    built.set(i, r);
  }
  return built.get(i);
}

function computeHome(r) {
  const box = new THREE.Box3().setFromObject(r.focus);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = size.length() / 2;
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const dist = (radius / Math.sin(Math.min(vfov, hfov) / 2)) * 1.02;
  const dir = V(...(r.view || [0.9, 0.34, 1.25])).normalize();
  const target = V(center.x, center.y * 0.95, center.z);
  return { target, pos: target.clone().addScaledVector(dir, dist), dist, radius };
}

function setEnvironment(h) {
  const { dist, radius, target } = h;
  camera.near = Math.max(0.1, dist / 300);
  camera.far = dist * 14;
  camera.updateProjectionMatrix();
  sky.scale.setScalar(camera.far * 0.9);
  ground.scale.setScalar(dist * 8);
  scene.fog.near = dist * 1.6;
  scene.fog.far = dist * 7;
  controls.minDistance = radius * 0.35;
  controls.maxDistance = dist * 3;
  const sdir = V(-0.55, 0.85, 0.45).normalize();
  sun.position.copy(target).addScaledVector(sdir, radius * 3);
  sun.target.position.copy(target);
  const sc = sun.shadow.camera;
  sc.left = sc.bottom = -radius * 1.4;
  sc.right = sc.top = radius * 1.4;
  sc.near = radius * 0.5;
  sc.far = radius * 6;
  sc.updateProjectionMatrix();
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = radius * 0.0012;
  flood.position.copy(target).addScaledVector(V(0.35, 0.3, 1).normalize(), radius * 3);
  flood.target.position.copy(target);
}

function flyTo(h, instant) {
  if (instant || reduceMotion) {
    camera.position.copy(h.pos);
    controls.target.copy(h.target);
    tween = null;
    controls.update();
    return;
  }
  tween = { t0: performance.now(), dur: 1100, fromPos: camera.position.clone(), fromTarget: controls.target.clone(), toPos: h.pos, toTarget: h.target };
}
controls.addEventListener('start', () => { tween = null; });

function select(i, instant = false) {
  i = (i + MONUMENTS.length) % MONUMENTS.length;
  if (i === current) return;
  const r = getBuilt(i);
  built.forEach((b, k) => { b.group.visible = k === i; });
  const first = current === -1;
  current = i;
  // Switching between very different scales: start the flight from the same angle, scaled to the new size.
  if (!first && !instant) {
    const prevDist = camera.position.distanceTo(controls.target);
    home = computeHome(r);
    const off = camera.position.clone().sub(controls.target).normalize().multiplyScalar(Math.max(prevDist, home.dist * 1.6));
    controls.target.copy(home.target);
    camera.position.copy(home.target).add(off);
  } else {
    home = computeHome(r);
  }
  setEnvironment(home);
  flyTo(home, first || instant);
  renderInfo(MONUMENTS[i]);
  document.querySelectorAll('.item').forEach((el, k) => el.setAttribute('aria-current', String(k === i)));
  const active = document.querySelectorAll('.item')[i];
  active?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
  try { history.replaceState(null, '', '#' + MONUMENTS[i].id); } catch (e) { /* ignore */ }
}

/* ---------- UI ---------- */
const $ = (id) => document.getElementById(id);
const list = $('list');
MONUMENTS.forEach((mo, i) => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.className = 'item';
  b.type = 'button';
  b.innerHTML = `<span class="name"></span><span class="h"></span><span class="place"></span>`;
  b.querySelector('.name').textContent = mo.name;
  b.querySelector('.h').textContent = mo.stat[1];
  b.querySelector('.place').textContent = mo.place;
  b.addEventListener('click', () => select(i));
  li.appendChild(b);
  list.appendChild(li);
});
function renderInfo(mo) {
  $('p-place').textContent = mo.place;
  $('p-name').textContent = mo.name;
  $('p-local').textContent = mo.local;
  $('p-local').lang = mo.lang;
  $('p-stat-label').textContent = mo.stat[0];
  $('p-stat').textContent = mo.stat[1];
  $('p-built').textContent = mo.built;
  $('p-style').textContent = mo.style;
  $('p-material').textContent = mo.material;
  const ul = $('p-facts');
  ul.replaceChildren(...mo.facts.map((t) => { const li = document.createElement('li'); li.textContent = t; return li; }));
}
if (matchMedia('(max-width: 760px)').matches) $('p-facts-wrap').open = false;

$('prev').addEventListener('click', () => select(current - 1));
$('next').addEventListener('click', () => select(current + 1));
$('reset').addEventListener('click', () => { home = computeHome(built.get(current)); flyTo(home); });
const rotBtn = $('rotate');
rotBtn.setAttribute('aria-pressed', String(controls.autoRotate));
rotBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  rotBtn.setAttribute('aria-pressed', String(controls.autoRotate));
});
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); select(current + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); select(current - 1); }
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function loop(now) {
  requestAnimationFrame(loop);
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k);
    camera.position.lerpVectors(tween.fromPos, tween.toPos, e);
    controls.target.lerpVectors(tween.fromTarget, tween.toTarget, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
}

const fromHash = MONUMENTS.findIndex((m) => m.id === location.hash.slice(1));
select(fromHash >= 0 ? fromHash : 2, true);
statusEl.hidden = true;
requestAnimationFrame(loop);
</script>
