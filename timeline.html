<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="India through time: a map of the subcontinent from the Indus cities to the Republic, with the borders, history and monuments of each era.">
<title>India through time · Monuments of India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Rozha+One&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/timeline.css">
<script>
  // The Day or Night choice made on the main page applies here too.
  try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body class="tl-body">

<div class="tl">
  <header class="tl-head">
    <div>
      <h1>India through time</h1>
      <p class="hi" lang="hi">काल के साथ भारत</p>
    </div>
    <a class="btn" href="index.html">All monuments in 3D</a>
  </header>

  <main class="tl-stage">
    <svg id="tl-map" class="tl-map" role="group" aria-label="Map of the Indian subcontinent for the chosen year" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tl-now" aria-live="polite">
      <p class="tl-year" id="tl-year"></p>
      <p class="tl-era" id="tl-era"></p>
      <p class="tl-standing" id="tl-standing"></p>
    </div>
    <ul class="tl-legend">
      <li><span class="dot t-sacred"></span>Temples &amp; shrines</li>
      <li><span class="dot t-fort"></span>Forts &amp; palaces</li>
      <li><span class="dot t-memorial"></span>Tombs &amp; memorials</li>
      <li><span class="dot t-civic"></span>Civic &amp; engineering</li>
      <li><span class="swatch-today"></span>India’s boundary today</li>
    </ul>
    <div class="maptip" id="tl-tip" role="tooltip" hidden></div>
  </main>

  <aside class="tl-card" id="tl-card" aria-live="polite">
    <p class="eyebrow" id="c-count"></p>
    <h2 id="c-name"></h2>
    <p class="span" id="c-span"></p>
    <h3>Who held power</h3>
    <p id="c-powers"></p>
    <h3>What changed on the map</h3>
    <p id="c-change"></p>
    <h3>Key dates</h3>
    <ul class="dates" id="c-dates"></ul>
    <p class="mapnote" id="c-map"></p>
    <h3>Monument of the era</h3>
    <div id="c-lead"></div>
    <div id="c-built-wrap">
      <h3 id="c-built-title"></h3>
      <ul class="built" id="c-built"></ul>
    </div>
  </aside>

  <footer class="tl-bar">
    <div class="tl-controls">
      <button class="btn" id="tl-prev" type="button" aria-label="Previous era">←</button>
      <button class="btn" id="tl-play" type="button" aria-pressed="false"><span class="tl-label">Play</span></button>
      <button class="btn" id="tl-next" type="button" aria-label="Next era">→</button>
    </div>
    <div class="tl-track">
      <input id="tl-range" type="range" min="0" max="1300" step="1" value="0" aria-label="Year">
      <div class="tl-bands" id="tl-bands" aria-label="Eras"></div>
    </div>
  </footer>
</div>

<script type="module" src="js/timeline.js"></script>
</body>
</html>
